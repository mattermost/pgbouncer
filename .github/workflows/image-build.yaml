name: Image build

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g., v1.23.1)'
        required: true
        default: 'v1.23.1'
        type: string
      pgbouncer_version:
        description: 'PgBouncer version (e.g., 1.23.1)'
        required: true
        default: '1.23.1'
        type: string

permissions:
  contents: read

jobs:
  build-docker:
    name: cd/Build and push docker image
    runs-on: ubuntu-22.04
    steps:
      - name: checkout-project
        uses: actions/checkout@ac593985615ec2ede58e132d2e21d2b1cbd6127c # v3.3.0
      - name: cd/Login to Chainguard Registry
        uses: docker/login-action@3da7dc6e2b31f99ef2cb9fb4c50fb0971e0d0139 # v2.1.0
        with:
          registry: cgr.dev
          username: ${{ secrets.CHAINGUARD_USERNAME }}
          password: ${{ secrets.CHAINGUARD_PASSWORD }}
      - name: cd/Login to Docker Hub
        uses: docker/login-action@3da7dc6e2b31f99ef2cb9fb4c50fb0971e0d0139 # v2.1.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME}}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: cd/Setup Docker Buildx
        uses: docker/setup-buildx-action@11e8a2e2910826a92412015c515187a2d6750279 # v2.4
      - name: cd/Docker build and push
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
          PGBOUNCER_VERSION: ${{ inputs.pgbouncer_version || '1.23.1' }}
          BUILD_DATE: ${{ github.run_number }}
          GIT_COMMIT: ${{ github.sha }}
        run: |
          # Build FIPS-compatible image with multiple tags
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --push \
            --build-arg PGBOUNCER_VERSION=${PGBOUNCER_VERSION} \
            --build-arg BUILD_DATE=${BUILD_DATE} \
            --build-arg GIT_COMMIT=${GIT_COMMIT} \
            --label "org.opencontainers.image.title=PgBouncer FIPS" \
            --label "org.opencontainers.image.description=FIPS-compatible PgBouncer with OpenSSL support" \
            --label "org.opencontainers.image.version=${PGBOUNCER_VERSION}" \
            --label "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --label "org.opencontainers.image.revision=${GIT_COMMIT}" \
            --label "org.opencontainers.image.source=https://github.com/mattermost/pgbouncer" \
            -t mattermost/pgbouncer:${TAG} \
            -t mattermost/pgbouncer:${TAG}-fips \
            -t mattermost/pgbouncer:${PGBOUNCER_VERSION}-fips \
            -t mattermost/pgbouncer:latest-fips \
            -f build/Dockerfile \
            .
